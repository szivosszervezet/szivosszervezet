<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preload" href="spacemono.woff2" as="font" type="font/woff2" crossorigin>

<style>
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 800;
    font-display: swap;
    src: url("barlow-800.woff2") format("woff2");
  }
  @font-face {
    font-family: "Space Mono";
    font-weight: 400;
    font-display: swap;
    src: url("spacemono.woff2") format("woff2");
  }

  :root {
    --ink: #171717;
    --paper: #f2f0ea;
    --lila: #6b3bb0;
    --bordo: #8e2638;
    --korall: #fd6046;
    --cian: #1ff4ff;         /* a glitch „hideg” csatornája */
    --ibolya: #c03cff;       /* a glitch „meleg” csatornája */
    --beat: 0.9s;            /* ~67 ütés/perc */
    --glitch: 7s;            /* ennyi időnként „akad meg” az adás */
    --oszlop: 368px;
    --mono: "Space Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--ink); -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--paper);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 800;
    background: var(--ink) url("textura.jpg") repeat;
    background-size: 600px 600px;
    overflow-x: hidden;
  }

  /* képernyő-hatás: finom pásztázó vonalak + sötétedő sarkok */
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  body::before {
    background: repeating-linear-gradient(to bottom,
      rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, .2) 2px, rgba(0, 0, 0, .2) 3px);
  }
  body::after {
    background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .55) 100%);
  }

  .lap {
    width: min(100% - 44px, var(--oszlop));
    margin: auto 0;
    padding: max(clamp(32px, 7vh, 72px), env(safe-area-inset-top)) 0 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ================= Logó: dobogó szívek + adáshiba ================= */

  .logo {
    width: 100%;
    animation:
      bekapcs .6s steps(1) both,
      remeg var(--glitch) steps(1) infinite 1.2s;
  }

  .jel {
    position: relative;
    width: 78%;
    margin: 0 auto;
    aspect-ratio: 640 / 334;
    transform-origin: 50% 58%;
    animation: dobbanas var(--beat) ease-out infinite;
  }
  .jel img,
  .jel .reteg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .fenyl {
    position: absolute;
    inset: 8% 12%;
    background: radial-gradient(closest-side, rgba(253, 96, 70, .55), rgba(253, 96, 70, 0));
    filter: blur(22px);
    opacity: .15;
    animation: fenyl var(--beat) ease-out infinite;
  }

  .hullam {
    -webkit-mask: url("sziv-hullam.png") center / 100% 100% no-repeat;
            mask: url("sziv-hullam.png") center / 100% 100% no-repeat;
    background-color: var(--korall);
    background-image: linear-gradient(90deg,
      rgba(255, 236, 230, 0) 0%, rgba(255, 236, 230, 0) 45%,
      rgba(255, 236, 230, .95) 50%,
      rgba(255, 236, 230, 0) 55%, rgba(255, 236, 230, 0) 100%);
    background-size: 300% 100%;
    background-repeat: no-repeat;
    background-position: 100% 0;
    animation: impulzus var(--beat) cubic-bezier(.45, 0, .3, 1) infinite;
  }

  /* színcsatornák: a logó cián és ibolya másolata, kicsit elcsúszva */
  .csatorna {
    mix-blend-mode: screen;
    opacity: .9;
    animation: var(--glitch) steps(1) infinite 1.2s;
  }
  .jel .csatorna {
    -webkit-mask: url("sziv-maszk.png") center / 100% 100% no-repeat;
            mask: url("sziv-maszk.png") center / 100% 100% no-repeat;
  }
  .felirat .csatorna {
    position: absolute;
    inset: 0;
    -webkit-mask: url("logo-szoveg.png") center / 100% 100% no-repeat;
            mask: url("logo-szoveg.png") center / 100% 100% no-repeat;
  }
  .csatorna { --d: 2px; }
  .felirat .csatorna { --d: 1px; }
  .cian   { background: var(--cian);   transform: translateX(calc(var(--d) * -1)); animation-name: csusz-c; }
  .ibolya { background: var(--ibolya); transform: translateX(var(--d));            animation-name: csusz-i; }

  .felirat { position: relative; margin: 16px auto 0; width: 92%; line-height: 0; }
  .felirat img { position: relative; z-index: 1; width: 100%; height: auto; }

  @keyframes dobbanas {
    0%   { transform: scale(1); }
    10%  { transform: scale(1.075); }
    21%  { transform: scale(.985); }
    32%  { transform: scale(1.04); }
    50%, 100% { transform: scale(1); }
  }
  @keyframes fenyl {
    0%   { opacity: .15; transform: scale(.92); }
    10%  { opacity: .85; transform: scale(1.08); }
    32%  { opacity: .6;  transform: scale(1.04); }
    70%, 100% { opacity: .15; transform: scale(.92); }
  }
  @keyframes impulzus {
    0%   { background-position: 100% 0; }
    55%, 100% { background-position: 0% 0; }
  }
  /* betöltéskor „bekapcsol” a kép, mint egy régi monitor */
  @keyframes bekapcs {
    0%   { opacity: 0; }
    20%  { opacity: 1; transform: skewX(-12deg); }
    35%  { opacity: .3; transform: none; }
    50%  { opacity: 1; transform: translateX(6px); }
    65%  { opacity: 1; transform: none; }
  }
  /* néhány másodpercenként rövid adáshiba */
  @keyframes remeg {
    0%, 86%  { transform: none; }
    87%      { transform: skewX(-6deg) translateX(-3px); }
    88%      { transform: skewX(4deg) translateX(4px); }
    89%, 94% { transform: none; }
    95%      { transform: translateX(-5px); }
    96%,100% { transform: none; }
  }
  @keyframes csusz-c {
    0%, 86%  { transform: translateX(calc(var(--d) * -1)); clip-path: inset(0); }
    87%      { transform: translate(-11px, 1px); clip-path: inset(10% 0 62% 0); }
    88%      { transform: translate(8px, -1px);  clip-path: inset(46% 0 22% 0); }
    89%      { transform: translate(-5px, 0);    clip-path: inset(72% 0 6% 0); }
    90%, 94% { transform: translateX(calc(var(--d) * -1)); clip-path: inset(0); }
    95%      { transform: translate(-9px, 0);    clip-path: inset(30% 0 48% 0); }
    96%,100% { transform: translateX(calc(var(--d) * -1)); clip-path: inset(0); }
  }
  @keyframes csusz-i {
    0%, 86%  { transform: translateX(var(--d)); clip-path: inset(0); }
    87%      { transform: translate(10px, -1px); clip-path: inset(55% 0 15% 0); }
    88%      { transform: translate(-7px, 1px);  clip-path: inset(5% 0 70% 0); }
    89%      { transform: translate(6px, 0);     clip-path: inset(38% 0 40% 0); }
    90%, 94% { transform: translateX(var(--d)); clip-path: inset(0); }
    95%      { transform: translate(9px, 0);     clip-path: inset(60% 0 18% 0); }
    96%,100% { transform: translateX(var(--d)); clip-path: inset(0); }
  }

  /* ================= Linkek: matricák ================= */

  .linkek {
    list-style: none;
    width: 100%;
    margin-top: clamp(30px, 5.5vh, 50px);
    display: grid;
    gap: 20px;
  }
  .linkek li { animation: felragaszt .4s cubic-bezier(.2, .9, .3, 1.3) both; }
  .linkek li:nth-child(1) { animation-delay: .45s; }
  .linkek li:nth-child(2) { animation-delay: .57s; }
  .linkek li:nth-child(3) { animation-delay: .69s; }
  @keyframes felragaszt {
    0%   { opacity: 0; transform: scale(1.15); }
    100% { opacity: 1; transform: none; }
  }

  .linkek a {
    --forma: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    position: relative;
    display: block;
    color: var(--betu);
    text-decoration: none;
    transform: rotate(var(--szog));
    transition: transform .18s cubic-bezier(.2, .9, .3, 1.4);
    -webkit-tap-highlight-color: transparent;
  }
  .linkek a::before {            /* színes „árnyék”, mint egy elcsúszott nyomat */
    content: "";
    position: absolute;
    inset: 0;
    background: var(--arnyek);
    clip-path: var(--forma);
    transform: translate(6px, 6px);
    transition: transform .18s cubic-bezier(.2, .9, .3, 1.4);
  }
  .arc {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 64px;
    padding: 14px 24px 13px;
    background: var(--szin);
    clip-path: var(--forma);
  }
  .tiktok    { --szin: var(--korall); --betu: var(--ink);   --arnyek: var(--cian);   --szog: -1.8deg; }
  .youtube   { --szin: var(--paper);  --betu: var(--ink);   --arnyek: var(--ibolya); --szog: 1.2deg; }
  .instagram { --szin: var(--lila);   --betu: var(--paper); --arnyek: var(--korall); --szog: -.9deg; }

  .linkek a:hover,
  .linkek a:focus-visible { transform: rotate(0) scale(1.03); }
  .linkek a:hover::before,
  .linkek a:focus-visible::before { transform: translate(10px, 9px); }
  .linkek a:hover .nev,
  .linkek a:focus-visible .nev {
    text-shadow: -2px 0 var(--cian), 2px 0 var(--ibolya);
    animation: rezeg .25s steps(2) infinite;
  }
  .linkek a:active { transform: scale(.97); transition-duration: .06s; }
  .linkek a:focus-visible { outline: 3px dashed var(--cian); outline-offset: 10px; }

  @keyframes rezeg {
    0%   { transform: translateX(0); }
    50%  { transform: translateX(1px); }
  }

  .ikon { width: 30px; height: 30px; flex: none; }
  .nev { display: inline-block; font-size: 2rem; line-height: 1; padding-top: 2px; }

  .handle {
    margin-top: 22px;
    font-family: var(--mono);
    font-size: .9rem;
    font-weight: 400;
    color: rgba(242, 240, 234, .62);
    text-align: center;
  }

  /* ================= Vészhelyzet: terminál-sor ================= */

  .sos {
    margin-top: clamp(30px, 5vh, 48px);
    font-family: var(--mono);
    font-weight: 400;
    font-size: 1rem;
    line-height: 1.6;
    text-align: center;
  }
  .sos .jel-prompt { color: var(--cian); }
  .sos a {
    display: inline-block;
    margin-left: 4px;
    padding: 2px 10px 0;
    background: var(--bordo);
    color: var(--paper);
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    text-decoration: none;
    box-shadow: 3px 3px 0 var(--korall);
  }
  .sos a:focus-visible { outline: 3px dashed var(--cian); outline-offset: 4px; }
  .kurzor {
    display: inline-block;
    width: .6em;
    height: 1.1em;
    margin-left: 6px;
    vertical-align: -0.2em;
    background: var(--paper);
    animation: villog 1.05s steps(1) infinite;
  }
  @keyframes villog { 50% { opacity: 0; } }

  footer {
    padding: 0 0 max(20px, env(safe-area-inset-bottom));
    font-family: var(--mono);
    font-size: .75rem;
    color: rgba(242, 240, 234, .4);
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .jel, .fenyl, .hullam, .csatorna, .linkek li, .kurzor, .linkek a:hover .nev { animation: none !important; }
    .fenyl { opacity: .35; }
    .linkek a, .linkek a::before { transition: none; }
  }
</style>
</head>
<body>

<main class="lap">

  <header class="logo">
    <div class="jel" aria-hidden="true">
      <div class="fenyl"></div>
      <div class="reteg csatorna cian"></div>
      <div class="reteg csatorna ibolya"></div>
      <img src="sziv-feher.png" alt="" width="640" height="334">
      <div class="reteg hullam"></div>
    </div>
    <h1 class="felirat">
      <span class="csatorna cian" aria-hidden="true"></span>
      <span class="csatorna ibolya" aria-hidden="true"></span>
      <img src="logo-szoveg.png" width="640" height="280"
           alt="Szívós Szervezet – Bulizzunk, de figyeljünk egymásra.">
    </h1>
  </header>

  <nav aria-label="Közösségi oldalaink">
    <ul class="linkek">
      <li>
        <a class="tiktok" href="https://www.tiktok.com/@szivos.szervezet" target="_blank" rel="noopener noreferrer">
          <span class="arc">
            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>
            </svg>
            <span class="nev">TikTok</span>
          </span>
        </a>
      </li>
      <li>
        <a class="youtube" href="https://www.youtube.com/@szivos.szervezet" target="_blank" rel="noopener noreferrer">
          <span class="arc">
            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>
            </svg>
            <span class="nev">YouTube</span>
          </span>
        </a>
      </li>
      <li>
        <a class="instagram" href="https://www.instagram.com/szivos.szervezet" target="_blank" rel="noopener noreferrer">
          <span class="arc">
            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/>
            </svg>
            <span class="nev">Instagram</span>
          </span>
        </a>
      </li>
    </ul>
    <p class="handle">Mindhárom helyen: @szivos.szervezet</p>
  </nav>

  <p class="sos">
    <span class="jel-prompt" aria-hidden="true">&gt;</span>
    Ha valaki rosszul van: <a href="tel:112">112</a><span class="kurzor" aria-hidden="true"></span>
  </p>

</main>

<footer>© 2026 Szívós Szervezet</footer>

</body>
