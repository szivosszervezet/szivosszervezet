<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Csak a saját domainről tölt be bármit: nincs külső szkript, nincs követés. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Szívós Szervezet – Bulizzunk, de figyeljünk egymásra.</title>
<meta name="description" content="Tények, nem prédikáció. Bulizóktól bulizóknak. Kövess minket TikTokon, YouTube-on és Instagramon.">
<link rel="canonical" href="https://szivosszervezet.hu/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://szivosszervezet.hu/">
<meta property="og:title" content="Szívós Szervezet">
<meta property="og:description" content="Bulizzunk, de figyeljünk egymásra.">
<meta property="og:image" content="https://szivosszervezet.hu/og-kep.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="hu_HU">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#171717">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<link rel="preload" href="papir.jpg" as="image">
<link rel="preload" href="barlow-800.woff2" as="font" type="font/woff2" crossorigin>

<style>
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 800;
    font-style: normal;
    font-display: swap;
    src: url("barlow-800.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 800;
    font-style: italic;
    font-display: swap;
    src: url("barlow-800-dolt.woff2") format("woff2");
  }
  @font-face {
    font-family: "Space Mono";
    font-weight: 400;
    font-display: swap;
    src: url("spacemono.woff2") format("woff2");
  }

  :root {
    --ink: #171717;
    --tinta: #1c2034;        /* a logó sötétkékje: „nyomdafesték” */
    --paper: #f2f0ea;
    --lila: #65369b;
    --bordo: #8e2638;
    --korall: #fd6046;
    --beat: 0.9s;            /* ~67 ütés/perc */
    --mono: "Space Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--ink); -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--tinta);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 800;
    background: var(--ink) url("textura.jpg") repeat;
    background-size: 600px 600px;
    overflow-x: hidden;
  }

  /* utcai lámpa fénye a falon + sötétebb szélek */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    background:
      radial-gradient(ellipse 70% 55% at 50% 22%, rgba(255, 228, 196, .09), rgba(255, 228, 196, 0) 70%),
      radial-gradient(ellipse at 50% 40%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, .55) 100%);
  }

  .fal {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(clamp(34px, 7vh, 80px), env(safe-area-inset-top)) 0 0;
    overflow: hidden;
  }

  /* ================= Régi plakátok és cafatok a falon ================= */

  .regi {
    position: absolute;
    pointer-events: none;
    z-index: 0;
  }
  /* egy régi lila plakát cafatja – a posztod textúrájából, szöveg nélküli részből */
  .regi-lila {
    width: 230px;
    height: 260px;
    top: 10px;
    left: calc(50% - 300px);
    background: var(--lila) url("plakat-lila.jpg") -560px -420px / 900px auto no-repeat;
    transform: rotate(-8deg);
    filter: brightness(.62) saturate(.85);
    clip-path: polygon(0 3%, 18% 0, 40% 4%, 63% 0, 84% 5%, 100% 1%, 97% 22%, 100% 41%, 93% 56%,
                       97% 70%, 86% 79%, 74% 74%, 61% 86%, 47% 80%, 33% 92%, 19% 85%, 7% 96%, 0 88%, 3% 60%, 0 34%);
  }

  .cafat {
    background: var(--paper) url("papir.jpg") center / 600px auto;
    filter: brightness(.58) sepia(.25);
  }
  .cafat-1 {
    width: 150px;
    height: 120px;
    top: 52%;
    left: calc(50% + 150px);
    transform: rotate(9deg);
    clip-path: polygon(0 4%, 22% 0, 48% 6%, 70% 0, 100% 8%, 92% 34%, 100% 58%, 81% 72%,
                       88% 100%, 60% 88%, 34% 100%, 12% 86%, 0 94%, 6% 60%, 0 30%);
  }
  .cafat-2 {
    width: 110px;
    height: 70px;
    bottom: 13%;
    left: calc(50% - 215px);
    transform: rotate(-14deg);
    background: var(--bordo);
    filter: brightness(.55);
    clip-path: polygon(0 10%, 30% 0, 62% 8%, 100% 0, 94% 45%, 100% 100%, 64% 90%, 28% 100%, 6% 82%);
  }

  /* ================= A fő plakát ================= */

  .plakat {
    position: relative;
    z-index: 2;
    width: min(100% - 36px, 400px);
    transform: rotate(-1.2deg);
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .6)) drop-shadow(0 14px 22px rgba(0, 0, 0, .4));
    animation: kiragaszt .55s cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes kiragaszt {
    0%   { opacity: 0; transform: rotate(-4deg) scale(1.06); }
    100% { opacity: 1; transform: rotate(-1.2deg) scale(1); }
  }

  .lap {
    position: relative;
    padding: 30px 24px 22px;
    text-align: center;
    background: var(--paper) url("papir.jpg") center top / cover;
    clip-path: polygon(0.5% 0.4%, 99.6% 0, 100% 100%, 0 99.6%);
  }

  /* a logó „rányomtatva”: a festék átveszi a papír szemcséjét */
  .jel {
    width: 76%;
    margin: 0 auto;
    aspect-ratio: 640 / 332;
    mix-blend-mode: multiply;
    transform-origin: 50% 58%;
    animation: dobbanas var(--beat) ease-out infinite;
  }
  .jel img { display: block; width: 100%; height: 100%; }

  .felirat { width: 88%; margin: 14px auto 0; line-height: 0; mix-blend-mode: multiply; }
  .felirat img { width: 100%; height: auto; }

  @keyframes dobbanas {
    0%   { transform: scale(1); }
    10%  { transform: scale(1.07); }
    21%  { transform: scale(.985); }
    32%  { transform: scale(1.035); }
    50%, 100% { transform: scale(1); }
  }

  .felhivas {
    margin-top: 22px;
    font-style: italic;
    font-size: clamp(1.25rem, 5.6vw, 1.45rem);
    line-height: 1.1;
    color: var(--tinta);
  }

  /* ================= Letéphető cetlik ================= */

  .cetlik {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;               /* az ollóvágások között látszik a fal */
  }

  .cetli {
    position: relative;
    display: block;
    height: 200px;
    color: var(--tinta);
    text-decoration: none;
    background: var(--paper) url("papir.jpg") var(--hely, 30%) 88% / 600px auto;
    border-top: 2px dashed rgba(28, 32, 52, .4);       /* perforáció */
    clip-path: polygon(0 0, 100% 0, 100% 99%, 70% 100%, 35% 98.5%, 0 100%);
    transform-origin: 50% 0;
    transform: rotate(var(--szog, 0deg));
    transition: transform .25s cubic-bezier(.3, 1.4, .5, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .cetlik li:nth-child(1) .cetli { --szog: 1.4deg;  --hely: 12%; }
  .cetlik li:nth-child(2) .cetli { --szog: -.8deg;  --hely: 46%; }
  .cetlik li:nth-child(3) .cetli { --szog: 2.1deg;  --hely: 78%; }

  .cetli:hover,
  .cetli:focus-visible { transform: rotate(calc(var(--szog, 0deg) + 5deg)) translateY(3px); }
  .cetli:active { transform: rotate(calc(var(--szog, 0deg) + 10deg)) translateY(9px); transition-duration: .1s; }
  .cetli:focus-visible { outline: 3px solid var(--korall); outline-offset: 3px; }

  /* a szöveg 90°-kal elforgatva, alulról felfelé – mint az igazi cetliken */
  .cetli-szoveg {
    position: absolute;
    top: calc(50% - 22px);
    left: 50%;
    width: 136px;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
  }
  /* a platformok hivatalos ikonjai: állva, változtatás nélkül */
  .ikon {
    position: absolute;
    left: 50%;
    bottom: 14px;
    width: 32px;
    height: 32px;
    object-fit: contain;
    transform: translateX(-50%);
  }
  .nev { display: block; font-size: 1.55rem; line-height: 1; }
  .handle {
    display: block;
    margin-top: 3px;
    font-family: var(--mono);
    font-weight: 400;
    font-size: .68rem;
    line-height: 1.2;
    opacity: .78;
  }

  /* valaki már letépett egyet */
  .letepve {
    height: 24px;
    background: var(--paper) url("papir.jpg") 95% 88% / 600px auto;
    border-top: 2px dashed rgba(28, 32, 52, .4);
    clip-path: polygon(0 0, 100% 0, 100% 62%, 86% 100%, 71% 58%, 55% 92%, 38% 50%, 22% 88%, 9% 55%, 0 78%);
  }

  /* ================= Ragasztószalag ================= */

  .szalag {
    position: absolute;
    z-index: 3;
    top: -13px;
    width: 92px;
    height: 28px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, .05)),
      rgba(226, 216, 190, .66);
    clip-path: polygon(3% 8%, 0 30%, 4% 52%, 0 74%, 3% 100%, 97% 92%, 100% 70%, 96% 46%, 100% 24%, 97% 0);
    animation: megjelenik .25s ease-out .45s both;
  }
  .szalag-bal  { left: -22px; transform: rotate(-36deg); }
  .szalag-jobb { right: -22px; transform: rotate(38deg); }
  @keyframes megjelenik { from { opacity: 0; } to { opacity: 1; } }

  /* ================= 112-es matrica ================= */

  .matrica {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 30px;
    padding: 9px 16px 8px;
    color: var(--paper);
    text-decoration: none;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 40%),
      var(--bordo);
    border: 3px solid #f7f5f0;          /* kivágott matrica fehér széle */
    border-radius: 12px;
    box-shadow: 0 2px 3px rgba(0, 0, 0, .55);
    transform: rotate(3deg) translateX(34px);
    animation: matrica .3s cubic-bezier(.2, .9, .3, 1.4) .75s both;
  }
  @keyframes matrica {
    from { opacity: 0; transform: rotate(10deg) translateX(34px) scale(1.25); }
    to   { opacity: 1; transform: rotate(3deg) translateX(34px) scale(1); }
  }
  .matrica-szoveg { font-style: italic; font-size: 1.1rem; line-height: 1.05; text-align: left; }
  .matrica-szam { font-size: 2.1rem; line-height: 1; padding-top: 2px; }
  .matrica:focus-visible { outline: 3px solid var(--korall); outline-offset: 4px; }

  footer {
    position: relative;
    z-index: 2;
    margin-top: auto;
    padding: 36px 0 max(18px, env(safe-area-inset-bottom));
    font-family: var(--mono);
    font-size: .72rem;
    color: rgba(242, 240, 234, .38);
  }

  @media (min-width: 760px) {
    .plakat { width: 420px; }
    .regi-lila { width: 300px; height: 300px; top: 70px; left: calc(50% - 520px); background-position: -520px -420px; transform: rotate(-6deg); }
    .cafat-1 { top: 120px; left: calc(50% + 300px); width: 190px; height: 150px; }
    .cafat-2 { bottom: 18%; left: calc(50% - 360px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .plakat, .jel, .szalag, .matrica { animation: none; }
    .cetli { transition: none; }
  }
</style>
</head>
<body>

<div class="fal">

  <div class="regi regi-lila" aria-hidden="true"></div>
  <div class="regi cafat cafat-1" aria-hidden="true"></div>
  <div class="regi cafat cafat-2" aria-hidden="true"></div>

  <main class="plakat">
    <span class="szalag szalag-bal" aria-hidden="true"></span>
    <span class="szalag szalag-jobb" aria-hidden="true"></span>

    <div class="lap">
      <div class="jel" aria-hidden="true">
        <img src="szivek-nyomat.png" alt="" width="640" height="332">
      </div>
      <h1 class="felirat">
        <img src="felirat-nyomat.png" width="640" height="279"
             alt="Szívós Szervezet – Bulizzunk, de figyeljünk egymásra.">
      </h1>
      <p class="felhivas">Tépj le egyet, és kövess minket!</p>
    </div>

    <nav aria-label="Közösségi oldalaink">
      <ul class="cetlik">
        <li>
          <a class="cetli" href="https://www.tiktok.com/@szivos.szervezet" target="_blank" rel="noopener noreferrer">
            <span class="cetli-szoveg">
              <span><span class="nev">TikTok</span><span class="handle">@szivos.szervezet</span></span>
            </span>
            <img class="ikon" src="tiktok.png" alt="" width="32" height="32">
          </a>
        </li>
        <li>
          <a class="cetli" href="https://www.youtube.com/@szivos.szervezet" target="_blank" rel="noopener noreferrer">
            <span class="cetli-szoveg">
              <span><span class="nev">YouTube</span><span class="handle">@szivos.szervezet</span></span>
            </span>
            <img class="ikon" src="youtube.png" alt="" width="32" height="32">
          </a>
        </li>
        <li>
          <a class="cetli" href="https://www.instagram.com/szivos.szervezet" target="_blank" rel="noopener noreferrer">
            <span class="cetli-szoveg">
              <span><span class="nev">Instagram</span><span class="handle">@szivos.szervezet</span></span>
            </span>
            <img class="ikon" src="instagram.png" alt="" width="32" height="32">
          </a>
        </li>
        <li aria-hidden="true"><div class="letepve"></div></li>
      </ul>
    </nav>
  </main>

  <a class="matrica" href="tel:112">
    <span class="matrica-szoveg">Ha valaki<br>rosszul van:</span>
    <span class="matrica-szam">112</span>
  </a>

  <footer>© 2026 Szívós Szervezet</footer>

</div>

</body>
</html>
