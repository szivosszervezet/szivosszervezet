<style>
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 800;
    font-style: normal;
    font-display: swap;
    src: url("barlow-800.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 800;
    font-style: italic;
    font-display: swap;
    src: url("barlow-800-dolt.woff2") format("woff2");
  }
  @font-face {
    font-family: "Space Mono";
    font-weight: 400;
    font-display: swap;
    src: url("spacemono.woff2") format("woff2");
  }

  :root {
    --ink: #171717;
    --paper: #f2f0ea;
    --lila: #65369b;
    --bordo: #8e2638;
    --korall: #fd6046;
    --beat: 0.9s;           /* ~67 ütés/perc: nyugodt, egészséges pulzus */
    --oszlop: 368px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--paper);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 800;
    background: var(--ink) url("textura.jpg") repeat;
    background-size: 600px 600px;
    overflow-x: hidden;
  }

  .lap {
    flex: 1;
    width: min(100% - 44px, var(--oszlop));
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: max(clamp(36px, 8vh, 84px), env(safe-area-inset-top));
  }

  /* ============ A jel: két szív, közös ütem ============ */

  .jel {
    position: relative;
    width: 78%;
    margin: 0 auto;
    aspect-ratio: 640 / 334;
    transform-origin: 50% 58%;
    animation: dobbanas var(--beat) ease-out infinite;
  }
  .jel img,
  .hullam { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* halvány korall fény a szívek mögött, ütemre felizzik */
  .fenyl {
    position: absolute;
    inset: 8% 12%;
    background: radial-gradient(closest-side, rgba(253, 96, 70, .55), rgba(253, 96, 70, 0));
    filter: blur(22px);
    opacity: .15;
    animation: fenyl var(--beat) ease-out infinite;
  }

  /* a hullám: a logó saját korall vonala, amin minden ütésnél
     végigfut egy fényimpulzus az egyik szívtől a másikig */
  .hullam {
    -webkit-mask: url("sziv-hullam.png") center / 100% 100% no-repeat;
            mask: url("sziv-hullam.png") center / 100% 100% no-repeat;
    background-color: var(--korall);
    background-image: linear-gradient(90deg,
      rgba(255, 236, 230, 0) 0%,
      rgba(255, 236, 230, 0) 45%,
      rgba(255, 236, 230, .95) 50%,
      rgba(255, 236, 230, 0) 55%,
      rgba(255, 236, 230, 0) 100%);
    background-size: 300% 100%;
    background-repeat: no-repeat;
    background-position: 100% 0;
    animation: impulzus var(--beat) cubic-bezier(.45, 0, .3, 1) infinite;
  }

  @keyframes dobbanas {   /* „lub-dub”: egy erős és egy kisebb dobbanás */
    0%   { transform: scale(1); }
    10%  { transform: scale(1.075); }
    21%  { transform: scale(.985); }
    32%  { transform: scale(1.04); }
    50%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  @keyframes fenyl {
    0%   { opacity: .15; transform: scale(.92); }
    10%  { opacity: .85; transform: scale(1.08); }
    32%  { opacity: .6;  transform: scale(1.04); }
    70%  { opacity: .15; transform: scale(.92); }
    100% { opacity: .15; transform: scale(.92); }
  }
  @keyframes impulzus {
    0%   { background-position: 100% 0; }
    55%  { background-position: 0% 0; }
    100% { background-position: 0% 0; }
  }

  .felirat { margin: 16px auto 0; width: 92%; line-height: 0; }
  .felirat img { width: 100%; height: auto; }

  /* ============ Linkek: tépett papírcímkék a posztokról ============ */

  .linkek {
    list-style: none;
    width: 100%;
    margin-top: clamp(28px, 5vh, 48px);
    display: grid;
    gap: 16px;
  }
  .linkek li {
    animation: felragaszt .42s cubic-bezier(.2, .9, .3, 1.25) both;
  }
  .linkek li:nth-child(1) { --szog: -1.6deg; --tol: 0px;  animation-delay: .15s; }
  .linkek li:nth-child(2) { --szog:  1.1deg; --tol: 5px;  animation-delay: .27s; }
  .linkek li:nth-child(3) { --szog:  -.7deg; --tol: -3px; animation-delay: .39s; }

  @keyframes felragaszt {
    0%   { opacity: 0; transform: translateY(-14px) scale(1.1); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }

  .linkek a {
    display: block;
    color: var(--ink);
    text-decoration: none;
    border-radius: 2px;
    -webkit-tap-highlight-color: transparent;
  }
  .papir {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 64px;
    padding: 14px 24px 13px;
    background: var(--paper);
    clip-path: polygon(0% 8%, 4% 0%, 18% 5%, 33% 1%, 51% 4%, 68% 0%, 86% 5%, 100% 0%,
                       99.2% 30%, 100% 64%, 99% 100%, 84% 94%, 66% 100%, 48% 95%,
                       30% 100%, 13% 94%, 0% 100%, 0.8% 54%);
    transform: translateX(var(--tol)) rotate(var(--szog));
    transition: transform .2s cubic-bezier(.2, .9, .3, 1.3), background-color .15s, color .15s;
  }
  .linkek a:hover .papir,
  .linkek a:focus-visible .papir {
    transform: translateX(0) rotate(0) scale(1.03);
    background: var(--lila);
    color: var(--paper);
  }
  .linkek a:active .papir { transform: scale(.97); transition-duration: .06s; }
  .linkek a:focus-visible { outline: 3px solid var(--korall); outline-offset: 7px; }

  .ikon { width: 30px; height: 30px; flex: none; }
  .nev {
    font-size: 2rem;
    line-height: 1;
    letter-spacing: .005em;
    padding-top: 2px;
  }

  .handle {
    margin-top: 20px;
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 400;
    font-size: .9rem;
    color: rgba(242, 240, 234, .62);
    text-align: center;
  }

  /* ============ Vészhelyzet ============ */

  .sos {
    margin: clamp(30px, 5vh, 52px) 0 0;
    font-style: italic;
    font-size: 1.35rem;
    line-height: 1.2;
    text-align: center;
  }
  .sos a {
    display: inline-block;
    margin-left: 6px;
    padding: 3px 10px 1px;
    background: var(--bordo);
    color: var(--paper);
    font-style: normal;
    text-decoration: none;
    transform: rotate(-2deg);
  }
  .sos a:focus-visible { outline: 3px solid var(--korall); outline-offset: 3px; }

  /* ============ Tömeg a lap alján, mint a sztorikon ============ */

  .tomeg {
    position: relative;
    width: 100%;
    max-width: 760px;
    margin-top: clamp(26px, 5vh, 56px);
    line-height: 0;
  }
  .tomeg img { width: 100%; height: auto; display: block; }
  .tomeg::after {          /* alul sötétedjen be, hogy a szöveg olvasható legyen */
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 40%;
    background: linear-gradient(rgba(23, 23, 23, 0), rgba(23, 23, 23, .85));
  }
  .copy {
    position: absolute;
    left: 0; right: 0;
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 1;
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 400;
    font-size: .8rem;
    line-height: 1.4;
    color: rgba(242, 240, 234, .7);
    text-align: center;
  }

  @media (min-width: 700px) {  /* széles kijelzőn alacsonyabb sáv, a széle beleolvad a háttérbe */
    .tomeg img {
      height: 360px;
      object-fit: cover;
      object-position: 50% 0;
    }
    .tomeg {
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
              mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .jel, .fenyl, .hullam, .linkek li { animation: none; }
    .fenyl { opacity: .35; }
    .papir { transition: none; }
  }
</style>
</head>
<body>

<main class="lap">

  <header>
